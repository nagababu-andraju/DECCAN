name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Code Quality and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      # Placeholder for actual Unity/C# linting logic
      - name: Run Linters
        run: echo "Linting complete (Placeholder)"

  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Using GameCI to run Unity tests. This is a standard and robust way for Unity CI.
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v2.0-alpha-6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          testMode: all # Runs both PlayMode and EditMode tests

  validate-content:
    name: Content Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Mission Validator
        run: bash tools/mission_validator.sh
