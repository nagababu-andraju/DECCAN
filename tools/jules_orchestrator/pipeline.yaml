# Jules Orchestrator Pipeline Configuration

stages:
  - name: "Vertical Slice"
    description: "Implement the complete DECCAN HEAT vertical slice defined by the repository specifications."
    tasks:
      - id: "prompt-1-vertical-slice"
        prompt: |
          Read AGENTS.md and all current project documentation before making changes.

          Implement the complete DECCAN HEAT vertical slice defined by the repository specifications.

          The purpose of this task is to prove the full gameplay loop rather than maximize content.

          Build one polished Hyderabad-inspired fictional district with enough road network, alleys, buildings, traffic space and mission locations to demonstrate the game.

          Use legally safe procedural, primitive, generated or clearly redistributable placeholder assets where final production assets do not yet exist.

          Implement:

          * third-person movement
          * camera
          * touchscreen controls
          * interaction system
          * vehicle entry and exit
          * one working car
          * one working motorcycle or auto-rickshaw
          * basic vehicle damage
          * simple traffic
          * pedestrians
          * basic NPC reactions
          * health
          * simple melee
          * basic ranged combat
          * basic police response
          * Heat/wanted system
          * money
          * minimap
          * objective navigation
          * mission checkpoints
          * save/load
          * day/night
          * pause menu
          * graphics settings
          * five complete missions

          The five missions must exercise substantially different combinations of gameplay systems.

          Do not implement five variants of the same mission.

          Add automated tests and validation wherever practical.

          Profile the vertical slice and document known performance problems.

          Do not expand to the complete world until the vertical-slice gameplay loop is working.

          At completion update BACKLOG.md, CHANGELOG.md, QUALITY_GATES.md and the project status report.
        dependencies: []
        parallel_safe: false

  - name: "World Streaming and Six-District City"
    description: "Expand the environment architecture into the complete V1 DECCAN HEAT city."
    tasks:
      - id: "prompt-2-world-streaming"
        prompt: |
          Read AGENTS.md and preserve all vertical-slice functionality.

          Expand the environment architecture into the complete V1 DECCAN HEAT city.

          Implement six distinct interconnected districts based on the WORLD_BIBLE.

          The game city should be a compressed fictionalized interpretation of Hyderabad rather than a meter-for-meter copy.

          Create a streaming architecture suitable for mobile.

          Use world sectors/chunks, LODs, pooled props and scalable simulation distances.

          Design major road loops and connections so that driving across the city is enjoyable.

          Include appropriate combinations of:

          * dense historical-style streets
          * bazaars
          * residential streets
          * apartments
          * offices
          * technology/business district
          * upscale hill roads
          * flyovers
          * lakefront roads
          * highways
          * industrial areas
          * garages
          * safehouses
          * mission locations
          * police facilities
          * shops
          * shortcuts
          * alleys

          Create distant visual landmarks that aid navigation.

          Ensure mission systems continue to function correctly when sectors unload and reload.

          Add streaming tests and performance instrumentation.

          Update world documentation and performance budgets.
        dependencies: ["prompt-1-vertical-slice"]
        parallel_safe: false

  - name: "Vehicle and Traffic System"
    description: "Turn the current vehicle prototype into a reusable mobile production system."
    tasks:
      - id: "prompt-3-vehicle-traffic"
        prompt: |
          Turn the current vehicle prototype into a reusable mobile production system.

          Create multiple vehicle classes with tunable data rather than duplicated vehicle scripts.

          Support approximately:

          * compact cars
          * sedans
          * hatchbacks
          * SUVs
          * vans
          * performance cars
          * motorcycles
          * scooters
          * auto-rickshaws
          * police vehicles

          Target roughly 25 distinct gameplay vehicle configurations for V1.

          Implement:

          * acceleration
          * braking
          * steering
          * handbrake
          * reverse
          * suspension
          * traction tuning
          * vehicle health
          * collisions
          * damage states
          * entry/exit
          * camera
          * headlights
          * horn
          * AI driving
          * traffic lights where useful
          * traffic spawning/despawning
          * vehicle pooling
          * stuck-vehicle recovery
          * police pursuit behavior

          Use simplified mobile physics where visual fidelity produces little gameplay value.

          Build automated validation ensuring every registered vehicle can spawn and initialize correctly.

          Profile CPU and physics cost.
        dependencies: ["prompt-2-world-streaming"]
        parallel_safe: false

  - name: "Living City NPC System"
    description: "Expand pedestrians and NPC simulation into a scalable mobile city system."
    tasks:
      - id: "prompt-4-npc-system"
        prompt: |
          Expand pedestrians and NPC simulation into a scalable mobile city system.

          Implement reusable archetypes and state-driven behavior including:

          * walking
          * wandering
          * waiting
          * crossing roads
          * conversation/idling
          * reacting to vehicles
          * reacting to collisions
          * reacting to combat
          * fleeing
          * calling/responding to authorities where appropriate
          * surrender/fear behavior
          * mission-specific behavior

          NPC simulation must degrade gracefully with distance.

          Use pooled characters and animation/AI LOD strategies.

          Avoid expensive full AI simulation for distant NPCs.

          Create population density profiles appropriate to different districts and times of day.

          Ensure civilians, mission NPCs and police are distinct gameplay categories.

          Add stress tests with increasing NPC counts and document safe mobile budgets.
        dependencies: ["prompt-2-world-streaming"]
        parallel_safe: true

  - name: "Combat, Police and Heat System"
    description: "Build a polished but mobile-efficient combat and law-enforcement gameplay loop."
    tasks:
      - id: "prompt-5-combat-heat"
        prompt: |
          Build a polished but mobile-efficient combat and law-enforcement gameplay loop.

          Implement:

          * melee
          * aiming
          * ranged weapons
          * reload
          * ammunition
          * hit reactions
          * player health
          * armor
          * damage
          * death/restart
          * NPC combat
          * cover awareness where practical
          * combat audio hooks

          Create a Heat system from 0 to 5.

          Heat escalation should influence:

          * police awareness
          * patrol response
          * pursuit vehicles
          * search radius
          * reinforcements
          * tactical aggression

          Implement believable loss-of-sight/search behavior rather than continuously knowing the player's exact location.

          The system must integrate with missions.

          Add debugging tools that visualize AI state, pursuit state and Heat calculations.

          Add automated tests for escalation and de-escalation.
        dependencies: ["prompt-3-vehicle-traffic", "prompt-4-npc-system"]
        parallel_safe: false

  - name: "Production Mission Engine"
    description: "Build the production-ready data-driven mission system required to support at least 100 missions without adding custom code for ordinary mission logic."
    tasks:
      - id: "prompt-6-mission-engine"
        prompt: |
          Treat this as a critical architecture task.

          Build the production-ready data-driven mission system required to support at least 100 missions without adding custom code for ordinary mission logic.

          Implement reusable objective primitives specified in MISSION_SYSTEM.md.

          Support:

          * sequential objectives
          * parallel objectives
          * optional objectives
          * branching
          * prerequisites
          * checkpoints
          * failure
          * retry
          * timers
          * rewards
          * dialogue
          * vehicle requirements
          * NPC references
          * Heat-state objectives
          * combat objectives
          * world-state conditions
          * mission unlock chains
          * analytics IDs

          Create authoring validation.

          Create a mission dependency graph.

          Create an automated mission-linter that detects:

          * missing references
          * missing destinations
          * unreachable objectives
          * invalid dependencies
          * circular unlock requirements
          * missing rewards
          * missing failure handling
          * impossible vehicle/NPC references

          Create debug tools allowing developers to immediately:

          * start any mission
          * jump to any objective
          * complete an objective
          * fail an objective
          * teleport to objective
          * inspect mission variables

          Convert the five vertical-slice missions to this system.

          No core gameplay system should depend on specific mission IDs.
        dependencies: ["prompt-1-vertical-slice"]
        parallel_safe: false

  - name: "Narrative and 100-Mission Plan"
    description: "Create the complete V1 narrative plan and 100 mission design records."
    tasks:
      - id: "prompt-7-narrative-plan"
        prompt: |
          Do not implement all missions yet.

          Create the complete V1 narrative plan.

          Develop an original protagonist, supporting cast, rivals and fictional organizations appropriate for DECCAN HEAT.

          Avoid copying existing game plots or characters.

          Avoid making real communities, religions, political parties or identifiable real organizations villains.

          Create a coherent progression through the six districts.

          Design exactly 100 playable missions divided approximately into:

          30 main-story missions
          40 substantial side missions
          30 contracts/activities

          Create a mission design record for every mission containing:

          * ID
          * title
          * district
          * unlock conditions
          * story purpose
          * characters
          * opening situation
          * objectives
          * required systems
          * escalation/twist
          * completion
          * reward
          * estimated duration
          * replay considerations

          Maintain variety.

          Use combinations of activities such as:

          driving
          chases
          races
          delivery
          investigation
          photography
          tracking
          stealth
          rescue
          escort
          defense
          combat
          vehicle theft
          timed traversal
          escape
          pursuit
          business activities
          social interactions
          multi-stage operations

          Do not produce dozens of superficial drive-there-and-shoot missions.

          Run a similarity audit and flag missions that are structurally too close to another mission.

          Generate the complete narrative dependency graph before implementing the content.
        dependencies: ["prompt-6-mission-engine"]
        parallel_safe: true

  - name: "Complete Player Experience"
    description: "Implement polished mobile-first HUD, UI, and menus."
    tasks:
      - id: "prompt-8-ux"
        prompt: |
          Read the current project and complete the game-facing UX.

          Implement polished mobile-first:

          * HUD
          * minimap
          * navigation
          * objective display
          * Heat indicator
          * health/armor
          * money
          * weapon/inventory interface
          * vehicle UI
          * mission results
          * mission retry
          * pause
          * settings
          * graphics quality selection
          * audio settings
          * control customization
          * sensitivity
          * accessibility options
          * subtitles
          * save slots if architecture permits

          The interface must have its own DECCAN HEAT visual language.

          Do not imitate GTA V or GTA VI interface layouts, typography or graphics.

          Optimize for different mobile aspect ratios and safe areas.

          Support touch and gamepad input.

          Test interface scaling automatically across representative screen sizes.
        dependencies: ["prompt-1-vertical-slice"]
        parallel_safe: true

  - name: "Mission Implementation Batch"
    description: "Implement a specific range of missions from the approved DECCAN HEAT 100-mission design."
    tasks:
      - id: "prompt-9-mission-batch"
        prompt: |
          Implement missions [MISSION RANGE] from the approved DECCAN HEAT 100-mission design.

          Do not modify the core mission engine unless an actual engine defect prevents implementation.

          Do not modify missions outside your assigned range.

          Each mission must use the existing data-driven mission architecture wherever possible.

          For every assigned mission:

          1. implement its complete mission definition,
          2. connect dialogue,
          3. connect NPC and vehicle references,
          4. define checkpoints,
          5. define failure/retry behavior,
          6. define rewards,
          7. add analytics identifiers,
          8. validate dependencies,
          9. add automated content validation,
          10. ensure it can be launched through the mission-debug system.

          Use reusable gameplay systems.

          Do not create mission-specific copies of systems already present.

          If a genuinely new reusable objective type is required, document it rather than silently implementing a bespoke workaround.

          Run the mission linter over the completed batch.

          Produce a completion matrix showing the status of every mission in the assigned range.
        dependencies: ["prompt-7-narrative-plan"]
        parallel_safe: true

  - name: "Integrate All 100 Missions"
    description: "Integrate and validate the complete 100-mission DECCAN HEAT catalog."
    tasks:
      - id: "prompt-10-integrate-missions"
        prompt: |
          Integrate and validate the complete 100-mission DECCAN HEAT catalog.

          Do not redesign functioning missions simply for stylistic preference.

          Run:

          * schema validation
          * reference validation
          * mission graph validation
          * unlock-chain validation
          * reward validation
          * content completeness validation
          * structural similarity analysis

          Confirm exactly 100 playable missions exist.

          Verify there is no mission progression dead end.

          Verify a new save can reach the final story mission through valid progression.

          Create automated traversal/simulation of mission unlock state where possible.

          Produce:

          MISSION_CATALOG_FINAL.md
          MISSION_DEPENDENCY_GRAPH
          MISSION_VALIDATION_REPORT.md

          Any broken mission must be repaired before declaring this stage complete.
        dependencies: ["prompt-9-mission-batch"]
        parallel_safe: false

  - name: "Economy and Progression"
    description: "Build a balanced single-player economy."
    tasks:
      - id: "prompt-11-economy"
        prompt: |
          Build a balanced single-player economy.

          Implement:

          * mission rewards
          * vehicle acquisition
          * garages
          * clothing/customization
          * consumable spending where appropriate
          * business/property progression where appropriate
          * progression unlocks
          * difficulty progression

          The base game must remain enjoyable without spending real money.

          Do not design intentionally frustrating progression to force purchases or ad viewing.

          Create economy simulation tools capable of estimating player earnings and spending over representative playthroughs.

          Check for exploits and progression blockers.
        dependencies: ["prompt-10-integrate-missions"]
        parallel_safe: false

  - name: "Ads and In-App Purchases"
    description: "Add commercial monetization architecture for Android and iOS."
    tasks:
      - id: "prompt-12-monetization"
        prompt: |
          Add commercial monetization architecture for Android and iOS.

          Keep all advertising and purchasing behind interfaces so platform SDKs remain replaceable and testable.

          Support development/test mode.

          Implement optional rewarded-ad placements at natural moments such as:

          * optional one-time mission revive
          * optional post-mission bonus
          * optional bonus reward

          Avoid aggressive advertising during active gameplay.

          Add configurable frequency caps.

          Implement in-app purchase architecture for:

          * Remove Ads
          * cosmetic packs
          * optional vehicle/customization packs
          * future mission expansion packs

          Avoid randomized paid loot boxes.

          Do not make core story completion dependent on purchases.

          Use the required platform billing mechanisms for digital content.

          Purchases must:

          * validate success before granting goods
          * safely handle interrupted purchases
          * restore restorable purchases
          * prevent duplicate grants
          * record relevant telemetry without storing sensitive payment data

          Never insert production advertising IDs or payment credentials into source control.

          Create configuration placeholders and clear release instructions.
        dependencies: ["prompt-11-economy"]
        parallel_safe: true

  - name: "Analytics and Live Product Foundation"
    description: "Implement privacy-conscious analytics interfaces."
    tasks:
      - id: "prompt-13-analytics"
        prompt: |
          Implement privacy-conscious analytics interfaces.

          Track useful product events including:

          * install/start
          * session duration
          * mission started
          * mission completed
          * mission failed
          * mission abandoned
          * death
          * vehicle use
          * district engagement
          * progression
          * rewarded-ad choice
          * purchase funnel
          * performance tier
          * crashes

          Do not collect information merely because it is available.

          Provide centralized event definitions rather than analytics calls scattered unpredictably through gameplay code.

          Build remote-configuration hooks for safe tunable values such as:

          * mission rewards
          * economy balance
          * ad frequency
          * graphics defaults

          Do not permit remote configuration to download and execute arbitrary code.
        dependencies: ["prompt-11-economy"]
        parallel_safe: true

  - name: "Mobile Performance Pass"
    description: "Systematically optimize all major systems for target mobile hardware."
    tasks:
      - id: "prompt-14-performance"
        prompt: |
          Treat performance as the primary objective of this task.

          Profile all major systems.

          Identify CPU, GPU, memory, rendering, physics, AI, garbage-collection and loading bottlenecks.

          Optimize systematically.

          Implement quality tiers and device-aware defaults.

          Audit:

          * draw calls
          * batches
          * materials
          * shaders
          * lights
          * shadows
          * particles
          * physics bodies
          * raycasts
          * NPC AI
          * traffic AI
          * animation
          * texture memory
          * meshes
          * audio memory
          * scene streaming
          * Addressables
          * garbage collection
          * allocations

          Preserve gameplay behavior while optimizing.

          Produce PERFORMANCE_FINAL.md containing measurable before/after results.

          The game should prioritize stable frame pacing over unnecessary visual effects.
        dependencies: ["prompt-10-integrate-missions"]
        parallel_safe: false

  - name: "Autonomous Gameplay QA"
    description: "Build automated and semi-automated gameplay QA infrastructure."
    tasks:
      - id: "prompt-15-qa-bots"
        prompt: |
          Build automated and semi-automated gameplay QA infrastructure.

          Create bot/test-controller capability able to exercise representative gameplay without a human.

          Where practical test:

          * spawn
          * movement
          * vehicle entry
          * driving
          * vehicle exit
          * combat
          * death
          * respawn
          * Heat escalation
          * Heat escape
          * mission start
          * mission checkpoints
          * mission completion
          * mission failure
          * mission retry
          * save
          * reload
          * district transitions

          Create long-duration soak tests.

          Run randomized sequences looking for:

          * exceptions
          * null references
          * stuck missions
          * invalid navigation
          * NPC explosions
          * runaway spawning
          * memory growth
          * unbounded object counts
          * save corruption

          Automatically produce QA reports.
        dependencies: ["prompt-10-integrate-missions"]
        parallel_safe: true

  - name: "Complete Game Audit"
    description: "Hostile release audit."
    tasks:
      - id: "prompt-16-audit"
        prompt: |
          Act as a hostile release auditor.

          Assume DECCAN HEAT is scheduled to ship commercially.

          Search the entire repository and game content for:

          * incomplete systems
          * placeholder functionality
          * TODOs
          * broken references
          * inaccessible missions
          * duplicated systems
          * debug cheats exposed in production
          * performance regressions
          * missing save handling
          * monetization defects
          * privacy concerns
          * copyrighted/unlicensed assets
          * unsupported dependencies
          * crash paths
          * insecure secrets
          * missing platform configuration
          * poor touch UX
          * inconsistent UI
          * inaccessible content

          Repair issues that can be safely repaired.

          Do not merely write an audit report.

          After repairs, rerun the complete automated validation suite.
        dependencies: ["prompt-12-monetization", "prompt-13-analytics", "prompt-14-performance", "prompt-15-qa-bots"]
        parallel_safe: false

  - name: "Release Candidate"
    description: "Prepare DECCAN HEAT Release Candidate 1."
    tasks:
      - id: "prompt-17-release-candidate"
        prompt: |
          Prepare DECCAN HEAT Release Candidate 1.

          The candidate must contain the complete intended V1 experience.

          Verify:

          * complete playable world
          * six districts
          * exactly 100 missions
          * progression
          * vehicles
          * pedestrians
          * traffic
          * police
          * combat
          * Heat system
          * economy
          * save/load
          * UI
          * settings
          * mobile controls
          * monetization test integration
          * analytics
          * performance configuration

          Build Android testing artifacts.

          Build the Android App Bundle configuration required for store release.

          Prepare the iOS project/build pipeline and execute it where appropriate signing infrastructure is available.

          Generate:

          FINAL_BUILD_REPORT.md
          FINAL_QA_REPORT.md
          PERFORMANCE_FINAL.md
          KNOWN_ISSUES.md
          STORE_RELEASE_CHECKLIST.md

          Do not submit anything publicly.

          The final pipeline state should become HUMAN_FINAL_REVIEW_REQUIRED.

          This is the first point at which the project should deliberately stop for my product review.
        dependencies: ["prompt-16-audit"]
        parallel_safe: false

retry_policy:
  max_retries: 3
  timeout_seconds: 3600

settings:
  automatic_plan_approval: true
  create_pull_requests: true
